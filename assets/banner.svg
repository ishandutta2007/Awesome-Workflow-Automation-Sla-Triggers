<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius: 12px; overflow: hidden;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="slaGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.65" />
      <circle cx="40" cy="40" r="1" fill="#334155" opacity="0.5" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Dynamic Animated Ambient Background Aura -->
  <g opacity="0.25">
    <circle cx="200" cy="180" r="160" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="r" values="140;180;140" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.15;0.3;0.15" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1000" cy="180" r="180" fill="#818cf8" filter="url(#glow)">
      <animate attributeName="r" values="180;140;180" dur="9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.35;0.2" dur="9s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="300" r="130" fill="#f43f5e" filter="url(#glow)">
      <animate attributeName="cy" values="320;270;320" dur="7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1;0.25;0.1" dur="7s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Dynamic Circuit / Pipeline Network Vectors in Deep Background -->
  <g stroke="#334155" stroke-width="2" fill="none" opacity="0.45">
    <!-- Path 1: Workflow Execution Pipeline -->
    <path id="pipeline1" d="M 80,70 L 320,70 L 400,120 L 780,120 L 860,70 L 1120,70" stroke-dasharray="8,8" />
    <!-- Path 2: SLA Escalation Path -->
    <path id="pipeline2" d="M 120,290 L 360,290 L 440,240 L 760,240 L 840,290 L 1080,290" stroke-dasharray="6,6" stroke="#475569" />
  </g>

  <!-- Animated Moving Pulses on Pipeline (Behind Foreground Text) -->
  <g>
    <!-- Pulse 1 -->
    <circle r="5" fill="#38bdf8" filter="url(#glow)">
      <animateMotion dur="6s" repeatCount="indefinite" path="M 80,70 L 320,70 L 400,120 L 780,120 L 860,70 L 1120,70" />
    </circle>
    <circle r="4" fill="#818cf8" filter="url(#glow)">
      <animateMotion dur="6s" begin="2.5s" repeatCount="indefinite" path="M 80,70 L 320,70 L 400,120 L 780,120 L 860,70 L 1120,70" />
    </circle>
    <!-- Pulse 2 (SLA breach monitor) -->
    <circle r="5" fill="#f43f5e" filter="url(#glow)">
      <animateMotion dur="7s" repeatCount="indefinite" path="M 120,290 L 360,290 L 440,240 L 760,240 L 840,290 L 1080,290" />
    </circle>
  </g>

  <!-- Decorative Interactive Floating Tech Badges (Left and Right Flanks) -->
  <!-- Left Side: Trigger Card -->
  <g transform="translate(60, 130)" opacity="0.85">
    <rect width="170" height="74" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="28" cy="28" r="10" fill="#0284c7" />
    <path d="M 24,28 L 27,32 L 33,24" stroke="#ffffff" stroke-width="2" fill="none" />
    <text x="46" y="32" fill="#e2e8f0" font-size="12" font-weight="600">Event Trigger</text>
    <text x="24" y="55" fill="#94a3b8" font-size="11">⚡ Webhook / Timer</text>
    <animateTransform attributeName="transform" type="translate" values="60,130; 60,124; 60,130" dur="5s" repeatCount="indefinite" />
  </g>

  <!-- Right Side: SLA Breach & Escalation Card -->
  <g transform="translate(970, 130)" opacity="0.85">
    <rect width="170" height="74" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="28" cy="28" r="10" fill="#e11d48">
      <animate attributeName="fill" values="#e11d48;#f97316;#e11d48" dur="3s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="32" fill="#ffffff" font-size="11" font-weight="bold">⏱️</text>
    <text x="46" y="32" fill="#e2e8f0" font-size="12" font-weight="600">SLA Monitor</text>
    <text x="24" y="55" fill="#f87171" font-size="11">🚨 Auto-Escalation</text>
    <animateTransform attributeName="transform" type="translate" values="970,130; 970,136; 970,130" dur="4.5s" repeatCount="indefinite" />
  </g>

  <!-- FOREGROUND: Main Title and Badges (Always in crisp foreground, clearly readable) -->
  <g text-anchor="middle">
    <!-- Top Pill Badge -->
    <g transform="translate(600, 52)">
      <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="-135" cy="0" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="10" y="5" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.5">ENTERPRISE BPM &amp; ORCHESTRATION</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="142" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.8">
      Workflow Automation <tspan fill="url(#primaryGlow)">&amp;</tspan> SLA Triggers
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="184" font-size="16" fill="#94a3b8" font-weight="400" letter-spacing="0.2">
      Durable Timers • Real-Time Escalation Engines • BPMN 2.0 • Open Source &amp; Enterprise SaaS
    </text>

    <!-- Bottom Feature Badges / Metadata Chips -->
    <g transform="translate(600, 246)">
      <!-- Badge 1: SaaS Leaders -->
      <g transform="translate(-230, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" fill="#cbd5e1" font-size="12" font-weight="500">☁️ Top SaaS Platforms</text>
      </g>
      <!-- Badge 2: Open Source -->
      <g transform="translate(-70, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" fill="#cbd5e1" font-size="12" font-weight="500">💻 10+ OSS Engines</text>
      </g>
      <!-- Badge 3: SLA Deadline Enforcers -->
      <g transform="translate(90, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" fill="#cbd5e1" font-size="12" font-weight="500">⏰ SLA Enforcement</text>
      </g>
      <!-- Badge 4: Production Ready -->
      <g transform="translate(245, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" fill="#cbd5e1" font-size="12" font-weight="500">🚀 Production Ready</text>
      </g>
    </g>

    <!-- Status Bar Divider Line -->
    <line x1="340" y1="295" x2="860" y2="295" stroke="#334155" stroke-width="1" />

    <!-- Footnote Stat -->
    <text x="600" y="322" font-size="12" fill="#64748b" font-weight="500">
      ⚡ Tracking breach prevention, milestone triggers, and durable execution workflows
    </text>
  </g>
</svg>